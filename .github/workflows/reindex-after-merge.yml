name: reindex-after-merge

# Squash-merge GUARANTEES a stale index after every template PR, and no
# pre-merge check can prevent it.
#
# build-index.sh records each skill's `hash` as the last commit touching
# generic/<name>.md, and `generatedFromCommit` as the last commit touching any
# index input. On a PR branch those are the branch's own commits. Squashing
# replaces them with one new commit on main, so the merged registry.json pins
# hashes that are unreachable from main — and every consumer's `skill outdated`
# then compares its .claude/skills.lock pin against a commit it cannot resolve.
# (Observed on #129: the merged index pinned `eb23914`; the squash commit on
# main is `c1bc870`. It took a manual reindex to fix, and nothing caught it.)
#
# validate-registry.yml's freshness gate deliberately excludes those two
# git-derived fields — it runs before the squash exists, so comparing them
# would fail every honest template PR. This workflow is the other half: it runs
# AFTER the squash, when the correct values finally exist, and opens a PR with
# them.
#
# ── Why the reindex PR shows no `validate` run ────────────────────────────────
# PRs opened with the default GITHUB_TOKEN do not trigger other workflows.
# GitHub does this on purpose, to stop a workflow from recursively triggering
# itself. So the PR this job opens will sit there with zero checks, which looks
# alarming and is not. It is fine here:
#   * the PR touches exactly one generated file, registry.json;
#   * that file is regenerated by this job from main's own post-squash history,
#     which is by definition the state validate-registry.yml would assert;
#   * the freshness gate re-runs on the very next human PR anyway.
# If you want the checks to run on it regardless, close and reopen the PR by
# hand — a human action re-triggers workflows. Do not swap in a PAT to work
# around this; the loop protection is worth more than the green tick.

on:
  push:
    branches: [main]
    paths:
      # Index INPUTS only. `paths:` runs the workflow when ANY changed file
      # matches, so listing only inputs means a push that changes nothing else
      # cannot start a run.
      #
      # registry.json is deliberately ABSENT, and must stay absent. This job's
      # own PR changes registry.json and nothing else; merging it is a push to
      # main whose only changed path is registry.json. If registry.json were
      # listed, that merge would match, retrigger this job, and — since the
      # index would then already be current — the run would at least be a
      # no-op, but any hash churn would loop it indefinitely. Enforced by
      # scripts/check-index-fresh.test.sh.
      #
      # scripts/build-index.sh is also absent, and that is not an oversight: a
      # generator change alters content-derived output (descriptions, line
      # counts), which is exactly what validate-registry.yml's freshness gate
      # DOES compare, so such a PR cannot merge without its regenerated index.
      # Only the git-derived fields need post-squash repair, and only an input
      # change moves those.
      - 'generic/**'
      - 'skill-guards.json'

# Needs write to push the reindex branch, and pull-requests to open/inspect the
# PR. Nothing else.
permissions:
  contents: write
  pull-requests: write

# Serialise runs so two rapid merges cannot race to force-push the same branch.
# Do not cancel in progress: a cancelled run leaves main's index stale.
concurrency:
  group: reindex-after-merge
  cancel-in-progress: false

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build-index.sh derives hashes from git history, so it needs full
          # history, not a shallow clone.
          fetch-depth: 0

      - name: Rebuild the index from main's post-squash history
        id: rebuild
        run: |
          ./scripts/build-index.sh
          if git diff --quiet -- registry.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "registry.json is already current at $(git rev-parse --short=7 HEAD) — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "registry.json is stale on main after the squash:"
            git --no-pager diff --unified=0 -- registry.json
          fi

      - name: Open or update the reindex PR
        if: steps.rebuild.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # One fixed branch is what makes this idempotent: a second merge
          # force-pushes the same ref, which updates the already-open PR
          # instead of opening a rival one.
          BRANCH: chore/reindex-registry
        run: |
          set -euo pipefail
          SHORT_SHA="$(git rev-parse --short=7 "$GITHUB_SHA")"

          # PREFLIGHT — check we are allowed to open a PR *before* pushing a branch.
          # Settings > Actions > General > "Allow GitHub Actions to create and
          # approve pull requests" is a repo-level switch, off by default. With it
          # off, `gh pr create` fails; doing that after the push would leave an
          # orphan branch, a red run, and the index still stale. Fail here instead,
          # having changed nothing, and say exactly which checkbox fixes it.
          CAN_PR="$(gh api "repos/${GITHUB_REPOSITORY}/actions/permissions/workflow" \
                      --jq '.can_approve_pull_request_reviews' 2>/dev/null || echo unknown)"
          if [ "$CAN_PR" = "false" ]; then
            echo "::error::GitHub Actions cannot open pull requests in this repo, so the" \
                 "reindex PR cannot be created. Enable Settings > Actions > General >" \
                 "'Allow GitHub Actions to create and approve pull requests', then re-run." \
                 "Nothing was pushed."
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add registry.json
          git commit -m "chore(registry): reindex after the squash merge of ${SHORT_SHA}"
          # Force-push is the update path, not a mistake: the branch is owned by
          # this workflow and is always rebuilt from main's current HEAD, so
          # replacing it wholesale is correct and keeps the PR to one commit.
          git push --force origin "HEAD:refs/heads/${BRANCH}"

          EXISTING="$(gh pr list --head "$BRANCH" --base main --state open \
                        --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            echo "Updated the open reindex PR #${EXISTING} (force-pushed ${BRANCH})."
            echo "PR=#${EXISTING} (updated)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          cat > "$RUNNER_TEMP/reindex-pr-body.md" <<'BODY'
          `registry.json` on `main` is stale. Squash-merging a template change rewrites
          the commit that `build-index.sh` records, so the merged index pins per-skill
          `hash` values (and a `generatedFromCommit`) that are unreachable from `main`.
          Consumers pin those hashes in `.claude/skills.lock`, so until this lands
          `skill outdated` compares against a commit it cannot resolve.

          This PR is `./scripts/build-index.sh` run on `main` after the squash. Nothing
          was hand-edited. Only `registry.json` changes.

          **Why there are no checks on this PR:** it was opened with the default
          `GITHUB_TOKEN`, and GitHub does not trigger workflows from token-authored
          events (recursion guard). Expected — see the comment block at the top of
          `.github/workflows/reindex-after-merge.yml`. Close and reopen the PR by hand
          if you want `validate` to run on it.

          Opened automatically by `.github/workflows/reindex-after-merge.yml`.
          BODY

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(registry): reindex after the squash merge of ${SHORT_SHA}" \
            --body-file "$RUNNER_TEMP/reindex-pr-body.md"
          echo "Opened a new reindex PR." >> "$GITHUB_STEP_SUMMARY"
