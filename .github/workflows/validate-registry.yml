name: validate-registry

# Guards the skill registry: registry.json stays in sync with generic/*.md and
# is genuinely the output of ./scripts/build-index.sh against this tree.
#
# The freshness gate below compares the committed index against a rebuild,
# EXCLUDING the two fields build-index.sh derives from git history —
# `generatedFromCommit` and the per-skill `hash`. Those resolve to the branch's
# own commit on a PR and to the squash commit once merged, so comparing them
# here would fail every honest template PR for a difference the author cannot
# avoid. Repairing them after the squash is
# .github/workflows/reindex-after-merge.yml's job. Every other field is derived
# from file content or the set of files on disk and IS compared; the reasoning,
# field by field, lives in scripts/check-index-fresh.py.
#
# Template-internal structure (H1 style, {{CUSTOMIZE}} markers) varies
# legitimately across templates and is validated at install time, so it is
# intentionally not gated here to avoid false positives.

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only reads the checked-out tree.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build-index.sh derives each template's hash from git history, so it
          # needs full history, not a shallow clone.
          fetch-depth: 0

      - name: registry.json in sync with generic/*.md
        run: |
          python3 - <<'PY'
          import json, glob, os, sys
          # Validate the COMMITTED registry — names, count, and descriptions — before
          # anything regenerates it, so a stale or empty entry in the checked-in file
          # is caught here rather than masked by a rebuild.
          with open('registry.json', encoding='utf-8') as f:
              reg = json.load(f)
          reg_names = sorted(s['name'] for s in reg['skills'])
          file_names = sorted(os.path.splitext(os.path.basename(p))[0] for p in glob.glob('generic/*.md'))
          ok = True
          if reg_names != file_names:
              print('::error::registry.json skill set is out of sync with generic/*.md '
                    '(run scripts/build-index.sh and commit)')
              missing = sorted(set(file_names) - set(reg_names))
              extra = sorted(set(reg_names) - set(file_names))
              if missing: print('  templates missing from registry:', missing)
              if extra:   print('  registry entries with no template:', extra)
              ok = False
          if reg.get('skillCount') != len(file_names):
              print(f"::error::skillCount {reg.get('skillCount')} != {len(file_names)} templates")
              ok = False
          undescribed = [s['name'] for s in reg['skills'] if not s.get('description', '').strip()]
          if undescribed:
              print('::error::registry entries with an empty description:', undescribed)
              ok = False
          if not ok:
              sys.exit(1)
          print(f"OK: {len(file_names)} templates, registry in sync (names + count + descriptions).")
          PY

      - name: continuity doctrine has not regressed
        run: |
          # skill-templates#205, as amended: the session seed lives at an ABSOLUTE
          # path outside every SESSION'S workspace ($CLAUDE_HANDOFF_DIR/NEXT-<scope>.md).
          # The default dir is itself a git repo — the vault is versioned — so the
          # property is not "outside anything git tracks"; it is that no worktree
          # teardown and no branch checkout a session performs can reach the seed.
          # Properties none of which the guard mechanism can hold: guards bind
          # generic/*.md, and every one of these lives in assets/ or spans files.
          #
          # Inline rather than scripts/*.sh on purpose: house style wants a
          # sibling .test.sh for every non-trivial script, and #209 is open
          # precisely because untested script assets exist. This is four scans.
          python3 - <<'PY'
          import os, re, sys

          ok = True

          def files_under(*roots):
              for root in roots:
                  for dirpath, _, filenames in os.walk(root):
                      for fn in filenames:
                          p = os.path.join(dirpath, fn)
                          try:
                              yield p, open(p, encoding='utf-8').read()
                          except (UnicodeDecodeError, OSError):
                              continue

          # 1. The dispatcher exists and still selects scope the way the design requires.
          #    A stub, or a swap of --git-common-dir for a $PWD prefix match, both
          #    read as "still there" to anything coarser than this.
          try:
              nxt = open('assets/next.md', encoding='utf-8').read()
          except FileNotFoundError:
              nxt = None

          # `None` (missing) and `''` (truncated to nothing) are one failure, reported
          # once. Do NOT gate the needle checks below on `if nxt` — an empty string is
          # falsy, so that spelling silently skips every check for the one file state
          # this step most needs to catch. It shipped that way for one commit and the
          # local negative test caught it.
          if not (nxt or '').strip():
              print('::error file=assets/next.md::assets/next.md is missing or empty — '
                    '/next is the read-time dispatcher this scheme replaces a maintained '
                    'status file with; an absent or stubbed dispatcher is the regression')
              ok = False
          else:
              # Anchor on the COMMAND, inside a fenced code block — not on a bare
              # mention of the script, which also appears in the prose explaining why
              # the dispatcher does not re-implement the key. A substring scan passes
              # a mutant that rewrites only the executable block (swapping the call
              # for `case "$PWD" in "$HOME"/Projects/*)`) while leaving the prose
              # untouched: the needle is still "present" and the scope test is gone.
              # Requiring the invocation inside a ``` fence is what makes deleting the
              # command fail the step.
              #
              # `/next` used to carry its own `git rev-parse --git-common-dir` block.
              # It now asks session-seed.py, so the WRITER and the READER of a seed
              # resolve the scope through one implementation — two hand-written copies
              # of that derivation is how a defect landed on only one side of it.
              in_fence, fenced_lines = False, []
              for ln in nxt.splitlines():
                  if ln.lstrip().startswith('```'):
                      in_fence = not in_fence
                      continue
                  if in_fence:
                      fenced_lines.append(ln)
              SCOPE_CMD = re.compile(r'session-seed\.py\s+(scope|path)\b')
              if not any(SCOPE_CMD.search(ln) for ln in fenced_lines):
                  print('::error file=assets/next.md::assets/next.md has no executable '
                        '`session-seed.py scope|path` call — a $PWD prefix match against '
                        '~/Projects reports fleet scope from inside a linked worktree, '
                        'which is where sessions actually run, and a second hand-written '
                        'copy of the git derivation is what this replaced. Prose naming '
                        'the script does not count; the command has to be in the code block')
                  ok = False
              # And the specific mutant, stated positively as a ban: the scope block must
              # not decide on a $PWD/$HOME prefix, in a fence or out of one.
              PWD_SCOPE = re.compile(r'(case\s+"?\$PWD|\$PWD"?\s*==|\$HOME/Projects/\*\))')
              for ln in fenced_lines:
                  if PWD_SCOPE.search(ln):
                      print(f'::error file=assets/next.md::assets/next.md resolves scope '
                            f'from a $PWD/$HOME prefix (`{ln.strip()}`) — that is the '
                            f'regression this design exists to prevent: worktrees live '
                            f'outside ~/Projects')
                      ok = False
              for needle, why in (
                  ('CLAUDE_HANDOFF_DIR', 'the seed directory the dispatcher reads'),
                  ('NEXT-', 'the per-scope seed filename it ranks'),
              ):
                  if needle not in nxt:
                      print(f'::error file=assets/next.md::assets/next.md no longer mentions '
                            f'`{needle}` — {why}')
                      ok = False

          # 2. The seed path itself, in the file that defines it. A revert here is the
          #    whole regression, so it is asserted positively rather than by absence.
          gcm = ''
          try:
              gcm = open('assets/global-CLAUDE.md', encoding='utf-8').read()
          except OSError:
              print('::error::assets/global-CLAUDE.md is missing')
              ok = False
          for needle in ('CLAUDE_HANDOFF_DIR', 'NEXT-<scope>.md'):
              if gcm and needle not in gcm:
                  print(f'::error file=assets/global-CLAUDE.md::the seed path lost `{needle}` — '
                        f'the seed is written outside every worktree, at '
                        f'$CLAUDE_HANDOFF_DIR/NEXT-<scope>.md')
                  ok = False

          # 3. Dead seed locations that must not come back, scoped to generic/ and
          #    assets/ — the files this repo authors. .claude/commands/*.md are
          #    version-stamped installed snapshots updated by `skill update`, and are
          #    deliberately out of scope.
          #
          #    `docs/handoffs` is banned as a seed location, NOT as a word: the amended
          #    design keeps it as a repo's optional narrative artifact, so an occurrence
          #    is legal only on a line that also says it is not the seed. That whitelist
          #    is one exact phrase, which no revert-to-in-repo-seeds mutant carries.
          NARRATIVE_OK = 'NOT the continuity mechanism'
          for p, body in files_under('generic', 'assets'):
              for i, ln in enumerate(body.splitlines(), 1):
                  if 'docs/handoffs' in ln and NARRATIVE_OK not in ln:
                      print(f'::error file={p},line={i}::{p}:{i} places a handoff under '
                            f'`docs/handoffs` — an in-repo seed dies with the worktree, the '
                            f'branch, or the index (three rounds, four loss paths). The seed '
                            f'is $CLAUDE_HANDOFF_DIR/NEXT-<scope>.md; docs/handoffs may only '
                            f'appear on a line stating it is {NARRATIVE_OK}')
                      ok = False
                  if 'handoffs/NEXT.md' in ln:
                      print(f'::error file={p},line={i}::{p}:{i} names the retired single '
                            f'global seed `NEXT.md` — one file for ~17 repos serialised the '
                            f'owner and made every session end a destructive write. Seeds are '
                            f'per-scope: NEXT-<scope>.md, archive-on-collide')
                      ok = False

          # 4. The floor is exactly five rules, and the two files that encode it agree.
          #    fleet-check.py compares by class, so a floor rule that silently loses its
          #    token is a floor rule that stops being checked.
          FLOOR = {'no-agent-attribution', 'explicit-path-staging', 'worktree-by-default',
                   'no-secrets-in-committed-files', 'seed-written-outside-any-worktree'}
          TOKEN = re.compile(r'^\s*<!--\s*(floor|default)\s*:\s*([a-z0-9][a-z0-9._-]*)\s*-->\s*$')
          doc_floor, seen = set(), []
          for ln in gcm.splitlines():
              m = TOKEN.match(ln)
              if not m:
                  continue
              seen.append(m.group(2))
              if m.group(1) == 'floor':
                  doc_floor.add(m.group(2))
          dups = sorted({i for i in seen if seen.count(i) > 1})
          if dups:
              print(f'::error file=assets/global-CLAUDE.md::duplicate rule-class token id(s) '
                    f'{dups} — fleet-check cannot compare a rule that appears twice')
              ok = False
          if doc_floor != FLOOR:
              print(f'::error file=assets/global-CLAUDE.md::floor tokens are {sorted(doc_floor)}, '
                    f'expected {sorted(FLOOR)}')
              ok = False
          try:
              fc = open('assets/scripts/fleet-check.py', encoding='utf-8').read()
          except OSError:
              fc = ''
          if not fc.strip():
              print('::error::assets/scripts/fleet-check.py is missing or empty — it is the only '
                    'thing that can tell machine-ahead from registry-ahead drift')
              ok = False
          else:
              script_floor = set(re.findall(r'"([a-z][a-z0-9-]+)",', fc.split('FLOOR_IDS = (', 1)[-1]
                                            .split(')', 1)[0]))
              if script_floor != FLOOR:
                  print(f'::error file=assets/scripts/fleet-check.py::FLOOR_IDS is '
                        f'{sorted(script_floor)}, expected {sorted(FLOOR)}')
                  ok = False
              # The fetch precondition, checked STRUCTURALLY and by NAME. A substring ban
              # on `|| true` is the trap this repo already fell into once: the phrase also
              # appears in the paragraph explaining why the fetch may not be softened, so
              # the needle is satisfied by prose and says nothing about the code.
              #
              # Binding to the call's own result variable is the other half. A window scan
              # for "some returncode test nearby" passes the real mutant — deleting the
              # fetch's `if` block leaves the NEXT command's returncode test inside the
              # window. So: find `<name> = subprocess.run([... "fetch" ...])`, then require
              # `<name>.returncode` and an exit that follows it.
              fcl = fc.splitlines()
              fetch_calls = []
              for i, ln in enumerate(fcl):
                  m = re.match(r'\s*(\w+)\s*=\s*subprocess\.run\(', ln)
                  if m and re.search(r'["\']fetch["\']', '\n'.join(fcl[i:i + 6])):
                      fetch_calls.append((m.group(1), i))
              if not fetch_calls:
                  print('::error file=assets/scripts/fleet-check.py::no `git fetch` call — the '
                        'comparison must refresh origin before reading it, or it is a confident '
                        'wrong answer about a stale clone')
                  ok = False
              for name, i in fetch_calls:
                  window = fcl[i:i + 14]
                  hit = [j for j, ln in enumerate(window) if re.search(rf'\b{name}\.returncode\b', ln)]
                  aborts = hit and re.search(r'\bdie\(|sys\.exit\(',
                                             '\n'.join(window[hit[0]:hit[0] + 6]))
                  if not aborts:
                      print(f'::error file=assets/scripts/fleet-check.py,line={i + 1}::the fetch '
                            f'result `{name}` is never tested for failure — `git fetch` is a hard '
                            f'precondition, so a failed fetch must exit, not fall through to a '
                            f'comparison against a stale clone')
                      ok = False
          if not os.access('assets/scripts/fleet-check.test.sh', os.X_OK):
              print('::error::assets/scripts/fleet-check.test.sh is missing or not executable')
              ok = False

          # 5. The seed logic is a SCRIPT, and the checklist INVOKES it.
          #
          #    #210: the End step was prose containing bash, transcribed and executed
          #    by an agent and tested by extracting the fenced blocks back out. Five
          #    adversarial rounds each fixed their findings and each introduced new
          #    ones, because every fix added more shell to a document. Two things have
          #    to hold or that arrangement comes back: the script and its suite exist,
          #    and the doc calls it inside a fence rather than restating it.
          for path, why in (
              ('assets/scripts/session-seed.py',
               'it owns scope resolution, the session id, archive-on-collide, the write '
               'and the proof — the logic that must not go back into prose'),
              ('assets/scripts/session-seed.test.sh',
               'house style wants a sibling suite for every shipped script, and these '
               'assertions are the only thing that can fail for a seed-destroying bug'),
          ):
              try:
                  if not open(path, encoding='utf-8').read().strip():
                      raise OSError
              except OSError:
                  print(f'::error::{path} is missing or empty — {why}')
                  ok = False
          if not os.access('assets/scripts/session-seed.test.sh', os.X_OK):
              print('::error::assets/scripts/session-seed.test.sh is not executable')
              ok = False

          try:
              slc = open('generic/session-lifecycle.md', encoding='utf-8').read()
          except OSError:
              slc = ''
              print('::error::generic/session-lifecycle.md is missing')
              ok = False
          in_fence, fenced = False, []
          for ln in slc.splitlines():
              if ln.lstrip().startswith('```'):
                  in_fence = not in_fence
                  continue
              if in_fence:
                  fenced.append(ln)
          if not any(re.search(r'session-seed\.py\s+write\b', ln) for ln in fenced):
              print('::error file=generic/session-lifecycle.md::End step 1 no longer '
                    'INVOKES `session-seed.py write` inside a code fence. Prose naming the '
                    'script does not count: a checklist that describes the write instead of '
                    'calling it is the transcribed-bash arrangement returning, and that is '
                    'the regression #210 removed')
              ok = False
          # The shell that moved OUT must not creep back in. These are the two blocks
          # the retired doctrine harness used to extract and run; either one reappearing
          # in the checklist means there are two implementations again.
          for pat, what in ((r'git\s+rev-parse\b[^\n]*--git-common-dir', 'the scope derivation'),
                            (r'\bmv\s+"\$SEED"', 'the archive rename')):
              for i, ln in enumerate(fenced, 1):
                  if re.search(pat, ln):
                      print(f'::error file=generic/session-lifecycle.md::{what} is inlined in a '
                            f'code fence again (`{ln.strip()}`) — it belongs to session-seed.py, '
                            f'which is tested; a second copy in the checklist is what drifted')
                      ok = False

          # 6. EXACTLY ONE SCOPE DERIVATION, repo-wide.
          #
          #    The step above holds only generic/session-lifecycle.md, which is where
          #    the extraction removed the copy. #210 then put a NEW one somewhere it
          #    does not look: assets/global-CLAUDE.md grew a hand-written
          #    `git rev-parse --path-format=absolute --git-common-dir` block four
          #    commits after the extraction whose entire purpose was to have one
          #    implementation — in the file every agent on every machine reads, which
          #    is the copy that wins a drift. So the scan is repo-wide now.
          #
          #    A DERIVATION IS EXECUTABLE; a mention is not. In markdown that line is
          #    the code fence, and it is not a technicality: assets/next.md's prose
          #    explains WHY the script uses --git-common-dir, which is exactly the
          #    documentation that should stay, and session-seed.py's own docstring
          #    does the same. Banning the string would delete the explanation and
          #    leave the duplication rule unstated. In a code file, a `#` comment is
          #    prose by the same test.
          DERIVES = '--git-common-dir'
          IMPL = 'assets/scripts/session-seed.py'
          # session-seed.test.sh's fake `git` matches on the flag to change a repo's
          # identity mid-run (the F3B proof case). It derives nothing; it intercepts.
          ALLOWED = {IMPL, 'assets/scripts/session-seed.test.sh'}
          for p, body in files_under('generic', 'assets'):
              if p.replace(os.sep, '/') in ALLOWED or DERIVES not in body:
                  continue
              in_f = False
              for i, ln in enumerate(body.splitlines(), 1):
                  if p.endswith('.md'):
                      if ln.lstrip().startswith('```'):
                          in_f = not in_f
                          continue
                      executable = in_f
                  else:
                      executable = not ln.lstrip().startswith('#')
                  if executable and DERIVES in ln:
                      print(f'::error file={p},line={i}::{p}:{i} is a SECOND scope '
                            f'derivation (`{ln.strip()[:80]}`). The scope key is derived in '
                            f'{IMPL} and nowhere else — that extraction is what #210 is; a '
                            f'copy here drifts from it and the copy in the most-read file is '
                            f'the one that wins. Call `session-seed.py scope` instead. Prose '
                            f'outside a code fence may still explain the flag')
                      ok = False

          #    The positive half. Without it the ban above is satisfied by DELETING the
          #    derivation — zero copies passes a "no second copy" scan perfectly.
          try:
              seed_src = open(IMPL, encoding='utf-8').read()
          except OSError:
              seed_src = ''
          rs = seed_src.split('\ndef resolve_scope(', 1)[-1].split('\n\ndef ', 1)[0]
          if not re.search(r'_git\([^)]*' + re.escape(DERIVES), rs):
              print(f'::error file={IMPL}::resolve_scope() no longer passes '
                    f'`{DERIVES}` to git — the scope key is the MAIN worktree\'s directory '
                    f'basename, and --git-common-dir is the only thing that reports it from '
                    f'a linked worktree, a nested subdirectory and a detached HEAD alike')
              ok = False
          #    ...and the global file, which used to hold the copy, must point AT the
          #    script. Deleting the snippet without leaving the pointer passes the ban
          #    and leaves every agent's most-read file with no answer at all.
          if gcm and 'session-seed.py scope' not in gcm:
              print('::error file=assets/global-CLAUDE.md::the seed-path rule no longer names '
                    '`session-seed.py scope`. The snippet it replaced was a second '
                    'implementation; removing it without the pointer leaves the file every '
                    'agent reads defining a scope key it cannot resolve')
              ok = False

          if not ok:
              sys.exit(1)
          print('OK: /next dispatcher intact; seed anchored outside every worktree; '
                'floor is the five rules in both files; the seed logic is a tested '
                'script, the checklist invokes it, and the scope is derived once.')
          PY

      - name: session-seed regression tests
        # REPLACES scripts/session-lifecycle-doctrine.test.sh, which extracted the
        # fenced bash out of generic/session-lifecycle.md and ran it. That harness
        # existed only because the logic lived in prose: extraction was the sole way
        # to execute a document. The logic is a script now, so the tests call it
        # directly and the doc's remaining job — the doctrine — is held by
        # skill-guards.json, which is what guards are for.
        #
        # The properties are the same ones and they still cannot be held by a scan:
        # "archive, then write" was two independent statements with a comment
        # between them, and every substring a scan could look for was present in the
        # broken version; a `[ -f "$SEED" ]` proof is indistinguishable from a real
        # one until you point it at another session's file and watch it pass.
        run: ./assets/scripts/session-seed.test.sh

      - name: usage-benchmark-row regression tests
        # #207: this script shipped in the registry WITHOUT the message.id dedup the
        # machine copy had, so the documented bootstrap
        # (`cp assets/scripts/usage-benchmark-row.py ~/.claude/scripts/`) handed a new
        # machine a version that counted every content block as a turn — ~2.2x on real
        # transcripts, 3x on the fixture here. It was found by reading the two files
        # side by side; nothing could fail for it, because nothing ran this script.
        #
        # A row is not a standalone number: session-lifecycle End step 2 is "neither
        # append nor overwrite" once a session has a row, so an inflated row is an
        # unrepairable column in a table read across sessions. The dedup case builds
        # its own un-deduped mutant and asserts the fixture tells the two apart —
        # without that, the assertion also passes on a transcript with no duplicate
        # lines, which is the shape every earlier eyeball check used.
        run: ./assets/scripts/usage-benchmark-row.test.sh

      - name: usage-pace regression tests
        # Added with the script itself, because #207 is precisely what happens
        # otherwise: usage-benchmark-row.py shipped here missing the machine copy's
        # dedup, and "nothing could fail for it, because nothing ran this script".
        # A suite that exists but is not wired into a step is worse than no suite —
        # it looks covered. There is no `*.test.sh` glob in this workflow, so every
        # new asset script needs its own step, by name.
        #
        # What this pins: the hook stays silent and exit-0 on hostile stdin (it runs
        # on EVERY prompt submit); last_model does not reacquire the compact-separator
        # fast path that would make it silently blind to a writer spacing change;
        # --units reports a tie as a tie instead of naming a unit that merely tied;
        # and the reading parser still tolerates the pre-token schema.
        #
        # Since the live readout landed it also pins the thing the whole script is for:
        # the percentage is READ from the desktop app's sample file and never computed.
        # The fixture builds that file under a fake HOME -- which works on this runner
        # precisely because the path is resolved relative to HOME -- then asserts the
        # printed sd, $/pt and remaining dollars against arithmetic done outside the
        # script, that halving the fixture's sd moves the line while the transcripts do
        # not, that a 48-minute-old sample is flagged stale and a 5-minute-old one is
        # not, that NEAR CAP appears nowhere, and that with no sample file at all the
        # line says "derived" instead of presenting a computed number as the meter.
        #
        # "Outside the script" is literal: the fixture writes out the per-million prices
        # and the minute-bucket rule itself rather than calling cost_usd and bucket_of, so
        # a mispriced tier fails HERE and not only in the machine-only comparison against
        # usage-trend.py, which this runner skips. It also pins a sample from before the
        # meter period being refused rather than reported, an anchor the app saw late being
        # differenced rather than divided, and every figure the readout prints -- the
        # landing, the need-per-hour and the hours-to-wall that warning (a) is built from
        # were each asserted by nothing while a doubling mutation kept the suite green.
        #
        # Since #256 it also pins the dedup POLICY: an assistant message written twice
        # under one requestId is billed at its COMPLETE record, at that record's minute,
        # whichever record the scan reaches first and whether the two halves arrive in
        # one scan or in two -- the defect that made this script's ALL-MODELS total read
        # 3.5-14.4% low per week (the main-thread total did not move at all; the
        # duplication is sidechain-only). It is the one thing here no local run can
        # notice, because both numbers look perfectly plausible.
        run: ./assets/scripts/usage-pace.test.sh

      - name: fleet-check regression tests
        # Proves the class split can still fail for its named regressions: a floor
        # difference exits 1, a default difference exits 0 naming the direction, and
        # an unfetchable origin refuses rather than reporting agreement.
        run: ./assets/scripts/fleet-check.test.sh

      - name: registry.json is freshly generated
        run: |
          # Subsumes the old "build-index runs cleanly" smoke step: it still runs
          # the generator (so an uncommitted template, a missing commit, or a
          # python failure fails here) and still parses the result as JSON, but
          # it now also compares the rebuild against what is committed.
          #
          # The committed file is stashed and restored, because later steps —
          # skill-lint.test.sh lints generic/create-pr.md against the repo's real
          # registry.json — must see the checked-in file, not the rebuild.
          #
          # actions/checkout gives a `pull_request` run the merge ref, not the PR
          # head. That is the right tree to validate here and needs no override:
          # the fields being compared come from file content, which is the merged
          # content, and the two fields that WOULD differ between head and merge
          # ref are the git-derived ones this check already excludes.
          cp registry.json "$RUNNER_TEMP/registry.committed.json"
          ./scripts/build-index.sh
          cp registry.json "$RUNNER_TEMP/registry.rebuilt.json"
          git checkout -- registry.json
          python3 scripts/check-index-fresh.py \
            "$RUNNER_TEMP/registry.committed.json" "$RUNNER_TEMP/registry.rebuilt.json"

      - name: compile-skill-targets unit tests
        run: node assets/compile-skill-targets.test.mjs

      - name: check-index-fresh regression tests
        # Proves the freshness gate ignores exactly the two git-derived fields
        # and nothing more (the false-positive case that would otherwise block
        # every template PR), and locks the anti-loop invariant on
        # reindex-after-merge.yml's `paths:` filter.
        run: ./scripts/check-index-fresh.test.sh

      - name: this repo's own installed skills lint clean
        run: |
          # #156: the registry was invisible to its own drift detection — nothing ran
          # skill-lint against .claude/commands/*.md, so every regression it fixes could
          # silently return. `if` blocks, not `[ … ] && …`: an and-list as the last
          # command exports the failed test's status.
          rc=0
          # A skill listed in the lockfile whose file has been DELETED is the failure the
          # loop below cannot see — it iterates over files that exist. Check presence first.
          python3 - <<'EOF' || rc=1
          import json, os, sys
          lock = json.load(open('.claude/skills.lock'))
          missing = [n for n in lock.get('skills', {}) if not os.path.exists(f'.claude/commands/{n}.md')]
          for n in missing:
              print(f"::error::{n} is in .claude/skills.lock but .claude/commands/{n}.md does not exist")
          sys.exit(1 if missing else 0)
          EOF
          for f in .claude/commands/*.md; do
            name=$(basename "$f" .md)
            if ! ./scripts/skill-lint.sh "$name" "$f" ./registry.json; then
              echo "::error file=$f::$name fails its own registry guards"
              rc=1
            fi
          done
          if [ "$rc" -ne 0 ]; then exit 1; fi

      - name: skill-lint regression tests
        # Covers the attribution check's line-anchored semantics — prose that
        # FORBIDS a footer (create-pr's first Critical Rule) must not be mistaken
        # for one — plus an end-to-end lint of generic/create-pr.md stripped the
        # way `skill add` strips it.
        run: ./scripts/skill-lint.test.sh

      - name: filed-from regression tests
        # #268: session 13cee7be filed ~8 follow-on issues in one session; 3 cited
        # their source PR. Without a machine-readable `Filed from:` line on EVERY
        # issue a skill files, the lagging metric "did this PR spawn work" is
        # uncomputable, and a rework chain (issue -> PR -> issue filed from it ->
        # PR ...) cannot be walked without a human re-reading every body. There is
        # no `*.test.sh` glob in this workflow, so filed-from.py gets its own named
        # step like every other asset script.
        #
        # What this pins: all four grammar forms parse (`#NNN`, `#NNN (<url>)`,
        # `session <id>`, `none`), surviving CRLF line endings and ignoring a line
        # quoted inside a fenced example; a line that starts with the exact
        # case-sensitive `Filed from:` prefix but fails the grammar is MALFORMED,
        # while a line in the wrong case or not anchored at line-start matches
        # neither regex and is MISSING instead — those are different findings with
        # different fixes, and collapsing them would make `check`'s reason column
        # lie; `check` flags a missing and a malformed body with the right reason,
        # passes a clean set, defaults to every open issue with `--label` narrowing
        # it (repeatable, and genuinely passed through to gh -- the fake `gh` logs
        # its own argv so the assertion is on what was ASKED, not just on what was
        # printed), notes a truncated (>= 500-result) listing instead of silently
        # under-reporting it, and exits 0/1/2 (2 — a `gh` failure, or an
        # unresolvable repo — is never silently read as "clean", the same
        # discipline `usage-benchmark-row.py`'s `_gh_json` follows).
        #
        # `chain` walks a three-link fixture in both directions (parents by the
        # line, children by a confirmed search that itself asks gh for more than
        # gh's own default of 30 results), stops at a bounded depth, terminates
        # rather than hanging on a mutual cycle, still detects a PR from ITS
        # PAYLOAD (a `gh issue view` on a PR number resolves in practice — the
        # `gh pr view` fallback is exercised as the defensive path it actually is,
        # not pinned as the primary one), and — the #274 review's C2 finding — a
        # `gh` failure PARTWAY through a walk surfaces on stderr, renders as a `?`
        # node rather than a silent gap, and exits 2: "the chain genuinely ends
        # here" and "gh could not tell us" must never render identically.
        #
        # Group D extracts the actual heredoc out of each edited generic/*.md and
        # runs it through bash for real — the #274 review's C1 finding was that
        # four templates put the new line inside a QUOTED heredoc, so `${PR_NUM}`
        # never expanded and the emitted body was malformed by this checker's own
        # rule, and nothing in Groups A-C (which only ever exercise the checker)
        # could have caught a bug in what the TEMPLATES emit.
        run: ./assets/scripts/filed-from.test.sh

      - name: review-result regression tests
        # #267: the subagent sidecar carried no result — a review agent's verdict
        # and findings existed only as prose in its final message, and a Workflow's
        # `result` was persisted in workflows/wf_*.json in whatever shape the
        # script happened to return, so neither was queryable across runs. There is
        # no `*.test.sh` glob in this workflow (see the usage-pace step above), so
        # this script needs its own named step too.
        #
        # What this pins: the hand-written validator names every violation by path
        # (`findings[2].severity: 'high' is not one of [...]`), not just pass/fail;
        # a required `kind: "review-result"` const keeps a merge-decision dict or
        # any other verdict/findings-shaped object from silently passing as one;
        # `mutation_ran` and `red_line` are validated as real booleans, not merely
        # present; the fenced ```json review-result``` block is extracted correctly
        # out of a full agent report — CRLF line endings and indentation inside a
        # markdown list item included — and the LAST such block wins when more than
        # one is present. `record` REFUSES — and writes nothing — on an unset
        # session id, a path-traversal `--session` or `--agent` value, an unknown
        # agent (no `.meta.json`/`.jsonl` sidecar at either sidecar level — see
        # below), an ambiguous or missing session directory, and an existing
        # `.result.json` without `--force`; every REFUSE case is asserted to have
        # left the filesystem exactly as it found it (a whole-tree snapshot diff
        # for the two REFUSE modes with no single directory to count files in).
        # `--pr`/`--skill` genuinely OVERRIDE the document's own fields, asserted
        # against a fixture that starts with different values, not merely fields
        # that were absent. `harvest` recovers a block from a subagent transcript's
        # LAST assistant message — even when later, non-assistant lines follow it —
        # skips an agent that already has a `.result.json`, and reports rather than
        # crashes on an invalid block. Both `record` and `harvest` check a SECOND
        # sidecar location, one level into `subagents/workflows/<runId>/`: a real
        # session inspected while building this carried 118 agents spawned by
        # Workflow runs there against 15 at the top level, and neither command saw
        # them before this was added. `list` walks a Workflow's `result` value
        # recursively and surfaces every nested dict that validates against the
        # schema — without copying it anywhere — while leaving a non-conforming
        # sibling out; `--near-misses` separately surfaces a dict with both a
        # `verdict` and a `findings` key that failed validation (typically no
        # `kind`, or a `verdict` from a different vocabulary such as a merge
        # decision's `fix-then-merge`) by path and first error — real data had
        # dozens of these, invisible from `list` before this flag existed. Its
        # `--json` output round-trips exact severity counts and the
        # `mutation_ran`/total ratio, at both sidecar levels.
        run: ./assets/scripts/review-result.test.sh

      - name: rework-lag regression tests
        # #271, epic #266, build item 5 of the session-evaluation plan: the
        # LAGGING signal — did a merged PR get reworked later? "A later PR
        # touched the same file" overcounts by roughly 10x (measured 2026-09-20
        # on Aeolus: 10 of 16 PRs by that naive metric, 1 of 16 by content-
        # matching added lines against later removed lines). There is no
        # `*.test.sh` glob in this workflow, so this script gets its own named
        # step like every other asset script.
        #
        # What this pins: line matching is per file, strips whitespace, and
        # excludes trivial (<=12 char) lines and `//`/`///`/`*`/`#`-prefixed
        # comment lines even when a later PR removes them verbatim — the
        # exact overcounting shape a file-level metric cannot see. A PR that
        # merely shares a touched FILE with a later PR, without any of its
        # own added lines being removed, is never counted as reworked — the
        # regression this script exists to reject. MATURITY is the load-
        # bearing honesty rule: a PR whose W-day window has not elapsed by
        # `--until` is `immature`, never `clean` — "clean" is earned only by
        # a window that ran out with no rework, and collapsing "no rework
        # yet" into "no rework" is exactly the dishonesty this script
        # replaces. `--until` makes a result reproducible: re-running the
        # same `--since`/`--until` after more PRs merge must not change the
        # answer, which is what the acceptance figure in #271 depends on —
        # pinned here by a PR excluded at one `--until` and included (and
        # reworking an until-then-clean PR) once `--until` moves forward.
        # Reverts are detected two ways — a `This reverts commit <sha>`
        # trailer prefix-matching the earlier PR's merge commit, and a full
        # line-level inversion with no revert wording — and a REVERT pair is
        # additionally present in the ordinary reworked/pairs data (it is not
        # double-counted, just visible from both), while a PARTIAL undo is
        # rework but explicitly not an inversion. Both issue measures
        # (reopened-issue detection, follow-on closure) import
        # `filed-from.py`'s `parse_filed_from` by path rather than
        # re-implementing the `Filed from:` grammar, and REFUSE (exit 2,
        # naming the missing sibling) when an issue measure is requested and
        # that sibling is absent — `--no-issues` skips both measures and
        # needs no sibling at all. A `gh`/`git` failure on any one measure
        # (a diff, a timeline call, an issue list) is reported as `unknown`
        # and forces exit 2 without ever reading as "clean" or "zero"; only a
        # failure of the PR list itself is fatal with no JSON emitted at all.
        # `--attribute` credits PRs to session ids using the same two-filter
        # discipline as `usage-benchmark-row.py`'s `scan_work` — nomination
        # from a transcript's own raw text (the identical regexes, reused
        # verbatim) intersected with the transcript's own `[t0, t1]` window —
        # and never opens a session id whose glob matches more than one
        # transcript. Four more regressions the review rounds found, each a
        # silent-zero mode and each pinned by a mutation the suite now
        # catches: diffs are read with `--diff-merges=first-parent`, because
        # plain `git show` on a TRUE two-parent merge commit emits an empty
        # diff (default `--cc`) with exit 0 — on a repo that does not squash-
        # merge every PR then reads clean; the diff parser tracks the remove
        # and add paths independently, so a deleted file (`+++ /dev/null`) or
        # a rename keeps its removed lines on its own (old) path instead of
        # dropping them or charging them to the previous file in the diff; a
        # PR whose diff could not be read at all lands in a fourth disjoint
        # bucket, `unreadable`, never in `clean`; and `--- `/`+++ ` are read
        # as file headers only before a block's first `@@`, because a
        # removed SQL/Lua comment line (`-- ...`) becomes `--- ...` once
        # diffed and used to repath the rest of its hunk. Quoted non-ASCII
        # paths are unescaped so a file's adds and removes share one key.
        #
        # Fold-in from #270's round-2 review (pr-record.py reuses this
        # script's `_transcript_span_and_text` for its own per-agent
        # transcript reads): a JSON line that parses but isn't an object
        # (a bare array/string/number) used to crash the whole function
        # with an AttributeError the instant `.get("timestamp")` ran on
        # it. It is now skipped like any other line that carries no
        # usable timestamp, pinned by a fixture transcript with a bare
        # `[1,2]` array mixed in between two real, nominating lines.
        run: ./assets/scripts/rework-lag.test.sh

      - name: session-distill regression tests
        # #269, epic #266: distill one session into asked -> understood/
        # delivered -> later-wrong records, one per RUN, classified against a
        # CLOSED vocabulary of evidence-quality failure modes. There is no
        # `*.test.sh` glob in this workflow, so this script gets its own named
        # step like every other asset script. The suite's `--model-cmd` points
        # at a fixture python script that reads the RUN_ID/SESSION_DISTILL_PASS
        # markers off stdin and echoes a canned envelope -- no real model is
        # ever invoked, so this step spends nothing and needs no network or
        # API key.
        #
        # What this pins: the unit of analysis is a RUN, both kinds -- a
        # subagent sidecar transcript (checked at BOTH levels review-
        # result.py's sidecar_dirs walks, top-level and one level into
        # subagents/workflows/<runId>/) and a MAIN-TRANSCRIPT user-turn span,
        # because a distiller that reads only subagents/** cannot see
        # anything that happened on the main thread. MAIN-TURN SEGMENTATION
        # uses `origin.kind == "human"` whenever any line in the transcript
        # carries an `origin` key at all, and falls back to a shape filter
        # (string content, not isMeta, not isSidechain, not opening with
        # `<task-notification>`/`<system-reminder>`/`<local-command`) only
        # when no line does -- pinned by two fixture sessions whose turn
        # counts differ (2 under `origin` vs 3 under `shape`, the extra one
        # being harness-adjacent text the shape rule cannot tell from a real
        # ask), with `segmented_by` asserted on both the document and every
        # main-turn run stub. A leading/trailing `<system-reminder>` block on
        # a human prompt is stripped from `asked`, never dropped -- the turn
        # stays real. A subagent with NO `.meta.json` is still emitted, with
        # null provenance, never silently skipped.
        #
        # The CLOSED VOCABULARY (exactly nine labels) is enforced twice: the
        # `--json-schema` handed to the chain-call carries the label set as
        # a JSON Schema enum (asserted against `schema`'s own output), AND
        # the returned document is re-checked against the same frozen tuple
        # before it is written -- an off-vocabulary label a stub model
        # returns becomes `"unclassified"` with the offending string
        # recorded in that record's `unclassified_reason`, never invented,
        # never passed through. Separately, a `classified_as` entry whose
        # `supports` names neither an existing claim id nor a valid
        # `later_wrong` index is DROPPED entirely, not merely relabelled --
        # pinned by a stub response that does exactly that. A model
        # `result` that is not valid JSON, and an envelope with
        # `is_error: true`, are each recorded in the document's `failures[]`
        # for that run/phase and skipped -- never a crash, never a silently
        # empty record; the run's already-successful distill pass survives a
        # failed chain pass. Finally: `--dry-run` prints a call-count/cost
        # projection and both calls and writes nothing (asserted by an empty
        # call log and a missing output file); `--resume` completes only the
        # runs missing from an existing output document, asserted by an
        # exact call-count budget across two `distill` invocations so a
        # regression that re-calls an already-done run is caught, not just
        # one that undercounts; `--max-cost-usd` stops before exceeding the
        # budget and records why in the document rather than truncating
        # silently or overspending; and an existing `--out` file REFUSES
        # (exit 2, naming `--force`) outside of `--resume`, while a missing
        # `assets/scripts/review-result.py` sibling REFUSES (exit 2, naming
        # it) before any of the above runs at all -- this script reuses
        # review-result.py's session-directory resolution rather than
        # re-deriving it a second time.
        #
        # PR #278 round 1 fixed and pinned ten more regressions: an
        # unreadable (chmod 000) main transcript and one that is nothing
        # but unparseable lines each used to produce the exact same output
        # as a healthy empty session at exit 0, `segmented_by` asserting a
        # rule ("shape") that never ran -- now both REFUSE-adjacent (exit
        # 2, JSON still emitted in full) with the failure named in a new
        # `unreadable[]` on both the `runs` and `distill` documents,
        # `segmented_by` is `null` rather than a fictitious rule name, and
        # a genuinely empty (0-byte) transcript still exits 0 with an empty
        # `unreadable[]` so legitimate emptiness is not misreported as a
        # failure. A `classified_as` entry's `supports` list is now
        # filtered ELEMENT-WISE (a dangling pointer alongside a valid one
        # used to survive into the written record verbatim) and a
        # `later_wrong` entry naming a claim id that does not exist is
        # dropped with a stderr warning instead of silently validating a
        # `classified_as` label against it. The distill system prompt now
        # states `proof` as a floor sourced from the full tool trace rather
        # than merely a preference, and the chain system prompt names the
        # exit-code-proxy pattern (`| head`/`| tail`/`| grep` before an
        # `echo $?`) explicitly, both pinned by inspecting the constructed
        # prompt text against a stub rather than a live model. The
        # `--dry-run`/`--max-cost-usd` cost projection now states its
        # basis instead of a bare number and is derived from a constant
        # measured on real payloads (~$0.167/call) rather than a one-token
        # prompt (~$0.0075/call, a 22x undercount); the budget is checked
        # against OBSERVED spend after every call, not only a stale
        # estimate before it, pinned by a stub reporting a real per-call
        # cost the old pre-call-only check would have blown through by
        # 70%+. `tool_digest` truncation now keeps the tail as well as the
        # head, because a long pipeline's `; echo "EXIT=$?"` -- exactly the
        # proxy pattern this tool exists to catch -- lives at the end. A
        # transcript line carrying `"origin": "human"` as a bare string
        # rather than `{"kind": "human"}` no longer raises AttributeError.
        # The session-level document now reports `runs_total` (the whole
        # session) and `runs_selected` (after `--only`) separately, rather
        # than calling a one-run `--only` document's `runs_total` "1"; and
        # `--force` without `--resume` combined with `--only`/`--limit`
        # now warns before silently discarding every other run's record on
        # an existing multi-run document. A record's own `cost_usd` now
        # always folds in a failed chain call's real spend, reconciling
        # `sum(records)` with the document's `total_cost_usd`. Two
        # coverage-only additions ride along: a fixture with `origin` on
        # its second line (not the first) pins that `has_origin` scans the
        # whole transcript, and `report` (both output forms), the default
        # `<session-dir>/session-distill.json` output path, and
        # `distill --out -` are now all exercised at least once each.
        run: ./assets/scripts/session-distill.test.sh

      - name: pr-record regression tests
        # #270, epic #266: the join table across the epic's other scripts —
        # one JSON-line record per merged PR, keyed on (repo, pr), joining
        # who did the work (session/agents), at what tier, in how many
        # rounds (review-result.py), with what CI/thread outcome (gh), and
        # what it spawned (filed-from.py's follow-on walk). There is no
        # `*.test.sh` glob in this workflow, so this script gets its own
        # named step like every other asset script.
        #
        # What this pins: a session id is never searched for, only
        # validated once given — its main transcript (a SIBLING of the
        # session directory, not inside it) must nominate the PR using
        # rework-lag.py's own URL_RE/REF_RE/BARE_RE grammar, imported by
        # path rather than copied, or the run REFUSES outright (exit 2,
        # nothing written); a session sourced from
        # $CLAUDE_CODE_SESSION_ID additionally REFUSES unless the PR's
        # own `mergedAt` falls inside that transcript's span
        # (merged_within_span), while a session named explicitly with
        # `--session` records that same fact without enforcing it. An
        # agent is linked to the PR only with recorded evidence — its
        # `.result.json`'s own `pr`, and/or its first user-turn message
        # naming the PR by `#N`/`PR N`/`pull/N` (each word-boundaried so
        # `#2780` can never match `#278`) or naming the PR's own head
        # branch — never by session membership alone; an agent matching
        # neither is counted in `agents_unlinked`, not silently
        # attributed. `usage` per agent is summed from assistant-line
        # `message.usage`, deduplicated by `requestId` keeping the LAST
        # record for each (the #259 lesson: the first is a partial), while
        # a line carrying no `requestId` is never deduplicated against
        # anything. `rounds_missing` reports every integer below the
        # highest RECORDED round that has no row of its own — pinned by a
        # fixture with only round 2 on record (missing: [1]), one with
        # only round 1 (missing: []), and one with both round 1 and round
        # 3 on record from two different agents (missing: [2] — the case
        # a naive "everything below the max" implementation gets wrong the
        # moment more than one round is actually on file). `ci.runs` is
        # filtered down to runs whose `headSha` is one of the PR's own
        # commit oids (an unrelated sha on the same branch must never
        # appear), and both `ci.runs` and `review_rounds.threads` report a
        # truncated gh answer in `unknown[]` while still emitting whatever
        # was returned — never collapsing a partial answer into a
        # measured zero. Every gh failure (PR view, run list, GraphQL
        # threads, the follow-on issue search) is reported as `unknown`
        # and forces exit 2 without ever reading as a silent `null` with
        # no explanation; only a failed PR lookup or an unmerged PR is
        # fatal outright. Sibling reuse is by path — review-result.py's
        # session/sidecar resolution, filed-from.py's follow-on walk,
        # rework-lag.py's nomination grammar — with `sys.dont_write_bytecode`
        # toggled around each import (asserted here: no `__pycache__/`
        # survives the suite), and a missing sibling REFUSES by name
        # rather than crashing. The ledger is JSONL, one line per
        # (repo, pr): a duplicate write REFUSES without `--replace`, which
        # itself rewrites atomically (temp file + `os.replace`) leaving
        # every other line untouched, and `--stdout` prints the record
        # without ever touching the ledger file at all.
        #
        # PR #270 round 2 (Opus review, 5 criticals + 5 suggestions + 2
        # nitpicks, all fixed and pinned):
        #
        # C1: a `.result.json` that fails to parse, that fails
        # review-result.py's own validate_document, or that validates but
        # carries a null `pr`, can never supply a "result" link -- but
        # when its raw text (or, for a parseable-but-invalid document, its
        # own `pr` field) still points at this PR, it now adds an
        # unknown[] entry naming the file and best-effort recovers a round
        # number, forcing exit 2, instead of the round it represents
        # silently vanishing from `rounds_missing`. C2: an unreadable
        # (OSError) agent transcript or meta.json, and a transcript line
        # that parses as JSON but is not an object, each add their own
        # unknown[] entry rather than the agent quietly landing in
        # `agents_unlinked` indistinguishable from "no evidence found".
        # C3: the "result" link now requires `result.repo == repo`
        # whenever `repo` is non-null (a same-numbered PR in a different
        # repo is not evidence); the head_ref brief match is now bounded
        # on both sides against `[A-Za-z0-9_./-]` (a branch called `fix`
        # no longer matches inside "prefix"); and a NEW per-agent TIMING
        # gate excludes any agent whose `started_at` is after the PR's own
        # `merged_at` into a new `agents_after_merge` counter, with an
        # agent that has no `started_at` at all excluded into
        # `agents_unlinked` with its own unknown[] entry instead of
        # linking on brief/result evidence alone -- reproduced on real
        # data, where a later, unrelated session linked its own agent to
        # PR #276 by brief text alone. C4: the ledger's read-check-write
        # is now guarded by an exclusive `fcntl.flock` on a sidecar
        # `<ledger>.lock`; a brand-new (repo, pr) is APPENDED as a single
        # line rather than rewriting the whole file, and only `--replace`
        # rewrites at all; a concurrent-writers test asserts two
        # invocations racing the same ledger both survive. C5: the tests
        # were hardened to actually catch a regression in each of --replace
        # silently no-op'ing, the (repo, pr) duplicate key collapsing to
        # `pr` alone, and validate_document being skipped -- each
        # mutation-checked (broken, confirmed red, restored) rather than
        # merely asserted once against working code. The tautological
        # `session.nominates_pr: true` field (always true, since a
        # non-nominating session always REFUSES before a record exists) is
        # removed rather than computed.
        #
        # S1: a truncated `ci.runs` list (gh's own --limit reached) is now
        # `null` + unknown[], matching the docstring's own claim -- a
        # truncated list may be missing the very run that would have
        # flipped `runs_failed`, so it is exactly as untrustworthy as a
        # failed call. S2: a session is now resolved by its main
        # TRANSCRIPT (`~/.claude/projects/*/<sid>.jsonl`), not by its
        # sidecar directory -- 404 of 590 transcripts on the author's
        # machine have no such directory at all, because a session that
        # spawns no subagents never creates one, and that must read as
        # `agents: []`, never a REFUSE. S3: `--replace` now preserves
        # blank lines and the ledger's own file mode, follows a symlinked
        # ledger path through to its target instead of overwriting the
        # link itself, and treats an unparseable line whose raw text still
        # names this PR and repo as a possible duplicate needing the same
        # REFUSE (or `--replace`) as a confirmed one; the "byte-for-byte"
        # preservation claim is removed since it was never quite true. S4:
        # `tier()` is now imported from usage-pace.py by path instead of a
        # second hand-maintained copy, and can record `"other"` for an
        # unrecognized model family instead of only ever null; usage dedup
        # now keys on `(message.id, requestId)` -- usage-pace.py's own key
        # -- instead of `requestId` alone, pinned by two lines that share a
        # requestId but differ in message.id. S5: `ci.final` now maps both
        # of GitHub's statusCheckRollup shapes (`CheckRun` and the legacy
