name: validate-registry

# Guards the skill registry: registry.json stays in sync with generic/*.md and
# is genuinely the output of ./scripts/build-index.sh against this tree.
#
# The freshness gate below compares the committed index against a rebuild,
# EXCLUDING the two fields build-index.sh derives from git history —
# `generatedFromCommit` and the per-skill `hash`. Those resolve to the branch's
# own commit on a PR and to the squash commit once merged, so comparing them
# here would fail every honest template PR for a difference the author cannot
# avoid. Repairing them after the squash is
# .github/workflows/reindex-after-merge.yml's job. Every other field is derived
# from file content or the set of files on disk and IS compared; the reasoning,
# field by field, lives in scripts/check-index-fresh.py.
#
# Template-internal structure (H1 style, {{CUSTOMIZE}} markers) varies
# legitimately across templates and is validated at install time, so it is
# intentionally not gated here to avoid false positives.

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only reads the checked-out tree.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build-index.sh derives each template's hash from git history, so it
          # needs full history, not a shallow clone.
          fetch-depth: 0

      - name: registry.json in sync with generic/*.md
        run: |
          python3 - <<'PY'
          import json, glob, os, sys
          # Validate the COMMITTED registry — names, count, and descriptions — before
          # anything regenerates it, so a stale or empty entry in the checked-in file
          # is caught here rather than masked by a rebuild.
          with open('registry.json', encoding='utf-8') as f:
              reg = json.load(f)
          reg_names = sorted(s['name'] for s in reg['skills'])
          file_names = sorted(os.path.splitext(os.path.basename(p))[0] for p in glob.glob('generic/*.md'))
          ok = True
          if reg_names != file_names:
              print('::error::registry.json skill set is out of sync with generic/*.md '
                    '(run scripts/build-index.sh and commit)')
              missing = sorted(set(file_names) - set(reg_names))
              extra = sorted(set(reg_names) - set(file_names))
              if missing: print('  templates missing from registry:', missing)
              if extra:   print('  registry entries with no template:', extra)
              ok = False
          if reg.get('skillCount') != len(file_names):
              print(f"::error::skillCount {reg.get('skillCount')} != {len(file_names)} templates")
              ok = False
          undescribed = [s['name'] for s in reg['skills'] if not s.get('description', '').strip()]
          if undescribed:
              print('::error::registry entries with an empty description:', undescribed)
              ok = False
          if not ok:
              sys.exit(1)
          print(f"OK: {len(file_names)} templates, registry in sync (names + count + descriptions).")
          PY

      - name: registry.json is freshly generated
        run: |
          # Subsumes the old "build-index runs cleanly" smoke step: it still runs
          # the generator (so an uncommitted template, a missing commit, or a
          # python failure fails here) and still parses the result as JSON, but
          # it now also compares the rebuild against what is committed.
          #
          # The committed file is stashed and restored, because later steps —
          # skill-lint.test.sh lints generic/create-pr.md against the repo's real
          # registry.json — must see the checked-in file, not the rebuild.
          #
          # actions/checkout gives a `pull_request` run the merge ref, not the PR
          # head. That is the right tree to validate here and needs no override:
          # the fields being compared come from file content, which is the merged
          # content, and the two fields that WOULD differ between head and merge
          # ref are the git-derived ones this check already excludes.
          cp registry.json "$RUNNER_TEMP/registry.committed.json"
          ./scripts/build-index.sh
          cp registry.json "$RUNNER_TEMP/registry.rebuilt.json"
          git checkout -- registry.json
          python3 scripts/check-index-fresh.py \
            "$RUNNER_TEMP/registry.committed.json" "$RUNNER_TEMP/registry.rebuilt.json"

      - name: compile-skill-targets unit tests
        run: node assets/compile-skill-targets.test.mjs

      - name: check-index-fresh regression tests
        # Proves the freshness gate ignores exactly the two git-derived fields
        # and nothing more (the false-positive case that would otherwise block
        # every template PR), and locks the anti-loop invariant on
        # reindex-after-merge.yml's `paths:` filter.
        run: ./scripts/check-index-fresh.test.sh

      - name: skill-lint regression tests
        # Covers the attribution check's line-anchored semantics — prose that
        # FORBIDS a footer (create-pr's first Critical Rule) must not be mistaken
        # for one — plus an end-to-end lint of generic/create-pr.md stripped the
        # way `skill add` strips it.
        run: ./scripts/skill-lint.test.sh
